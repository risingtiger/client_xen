

<c-form name="mainform">
	<c-in label="Merchant" name="merchant" type="text" val="${_m.transaction.merchant}" @save="${(e)=>this.prop_changed(e)}"></c-in>
	<c-in label="Amount" name="amount" type="number" val="${_m.transaction.amount}" @save="${(e)=>this.prop_changed(e)}"></c-in>
	<c-in label="Cat" name="cat" type="dselect" val="${_m.transaction.cat._path.segments[1]}" options="${this.m.cats.map(m=> `${m.name}:${m.id}`)}" @save="${(e)=>this.prop_changed(e)}"></c-in>
	<c-in label="Notes" name="notes" type="text" val="${_m.transaction.notes}" @save="${(e)=>this.prop_changed(e)}"></c-in>
	<c-in label="ID" name="id" type="text" val="${_m.transaction.id}" @save="${(e)=>this.prop_changed(e)}"></c-in>
</c-form>
